<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Sin esto, el celular renderiza todo a "ancho de escritorio" y después lo achica con zoom. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>DivGasto</title>
  <!-- Ícono de la app: el ícono de DivGasto (cuadro morado con la "D", el signo ÷, las flechas y el billete).
       Se usa en la pestaña y, sobre todo, cuando alguien agrega la página como acceso directo a la pantalla de inicio:
       - Android (Chrome) toma el ícono del manifest (icon-192.png / icon-512.png): son "maskable", a sangre y sin
         transparencia, para que Android lo recorte en círculo o cuadro redondeado sin dejar borde blanco.
       - iPhone e iPad toman el "apple-touch-icon" (180 px, sin transparencia ni borde: iOS le pone las esquinas redondeadas).
       - Los navegadores de computador usan los PNG pequeños (32 y 64 px) en la pestaña.
       Van dentro de este mismo archivo, así no hay que subir imágenes aparte.
       "apple-mobile-web-app-title" es el nombre corto que iPhone escribe bajo el ícono. -->
  <meta name="apple-mobile-web-app-title" content="DivGasto">
  <!-- Pantalla completa al abrir desde el acceso directo:
       - iPhone/iPad: sin barra de Safari; la barra de estado (hora, batería) queda transparente sobre el morado.
       - Android: lo controla "display" en manifest.webmanifest. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="application-name" content="DivGasto">
  <!-- Color de la barra del navegador en Android (el morado del encabezado de la app) -->
  <meta name="theme-color" content="#3F1964">
  <!-- Manifest: le dice a Android qué ícono usar al "Agregar a pantalla de inicio".
       manifest.webmanifest, icon-192.png e icon-512.png deben estar en la MISMA carpeta que este archivo. -->

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      /* Arriba morado (detrás de la barra de estado / muesca, igual que el encabezado de la app)
         y abajo lila claro (detrás de la barra de gestos), igual que el fondo de la app. */
      background: linear-gradient(to bottom, #3F1964 0 50%, #F3F0F8 50% 100%);
    }
    #contenedorIframe {
      position: fixed;
      /* En pantalla completa la página llega hasta los bordes del teléfono:
         se deja libre el espacio de la muesca, la barra de estado y la barra de gestos
         (en navegador normal o computador estos valores son 0). */
      top: env(safe-area-inset-top, 0px);
      right: env(safe-area-inset-right, 0px);
      bottom: env(safe-area-inset-bottom, 0px);
      left: env(safe-area-inset-left, 0px);
      background: #F3F0F8;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    /* Botón de pantalla completa: abajo a la izquierda, sobre la barra de gestos */
    #btnPantallaCompleta {
      position: fixed;
      left: calc(14px + env(safe-area-inset-left, 0px));
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      z-index: 10;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      padding: 0;
      background: rgba(63, 25, 100, .88); /* morado de DivGasto */
      color: #fff;
      border: none;
      border-radius: 50%;
      box-shadow: 0 2px 10px rgba(0,0,0,.25);
      cursor: pointer;
    }
    #btnPantallaCompleta svg { width: 22px; height: 22px; }
    #btnPantallaCompleta:focus-visible { outline: 3px solid #C9B3F5; outline-offset: 2px; }
    #btnPantallaCompleta[hidden] { display: none; }
  </style>
</head>
<body>

  <div id="contenedorIframe">
    <iframe
      id="miIframe"
      src="https://script.google.com/macros/s/AKfycbyqRkF9nRhhlgucaciawipfQg5nEyWV72RdG2ALNp_5s_msnQVc_lBuoudRPvBtps1ufg/exec"
      title="DivGasto"
      allowfullscreen
      allow="fullscreen; clipboard-write"
    ></iframe>
  </div>

  <script>
    const btn = document.getElementById('btnPantallaCompleta');
    const raiz = document.documentElement;
    const pedir = raiz.requestFullscreen || raiz.webkitRequestFullscreen;
    const salir = document.exitFullscreen || document.webkitExitFullscreen;
    const enPantallaCompleta = () => !!(document.fullscreenElement || document.webkitFullscreenElement);

    // Abierta desde el acceso directo (ya está en pantalla completa / modo app)
    const comoApp = window.matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches
                 || window.navigator.standalone === true;

    // Se muestra el botón solo donde sirve: el navegador permite pantalla completa
    // (el iPhone no lo permite para páginas; el iPad y Android sí) y no se abrió como app.
    function actualizarBoton() {
      btn.hidden = !pedir || comoApp || enPantallaCompleta();
    }

    function alternarPantallaCompleta() {
      if (enPantallaCompleta()) { if (salir) salir.call(document); return; }
      if (!pedir) return;
      const r = pedir.call(raiz, { navigationUI: 'hide' });
      if (r && r.catch) r.catch(err => console.error('No se pudo activar pantalla completa: ' + err.message));
    }

    document.addEventListener('fullscreenchange', actualizarBoton);
    document.addEventListener('webkitfullscreenchange', actualizarBoton);
    actualizarBoton();
  </script>

</body>
</html>
